version: "3.9"

# HelpIQ demo — production-ready POC.
# 2 services orchestrated:
#   - helpiqai (Next.js frontend on host port 3008)
#   - helpiqai-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  helpiqai-backend:
    image: ghcr.io/wikolabs/helpiqai-backend:latest
    container_name: helpiqai-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
networks:
  helpiqai-net:
    name: helpiqai-net
    driver: bridge
