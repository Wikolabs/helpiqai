version: "3.9"

# helpiqai demo - production-ready POC.
# 2 services orchestrated:
#   - helpiqai (Next.js frontend on host port 3008)
#   - helpiqai-backend (FastAPI Python, internal only on 8000)
# Shared external network wkdemo-net (created once by deploy.yml) avoids
# Docker default address-pool exhaustion across all 47 LP stacks.

services:
  helpiqai-backend:
    image: ghcr.io/wikolabs/helpiqai-backend:latest
    container_name: helpiqai-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - wkdemo_net

  helpiqai:
    image: ghcr.io/wikolabs/helpiqai:latest
    container_name: helpiqai
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      BACKEND_URL: "http://helpiqai-backend:8000"
    depends_on:
      - helpiqai-backend
    networks:
      - wkdemo_net

networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
