name: Deploy helpiqai

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to VM via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WIKOLABS_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.WIKOLABS_VM_HOST }}
          VM_USER: ${{ secrets.WIKOLABS_VM_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ServerAliveInterval=30             -o ServerAliveCountMax=30             "$VM_USER@$VM_HOST"             "set -e; if [ -d /opt/helpiqai/.git ]; then cd /opt/helpiqai && git fetch origin main && git reset --hard origin/main; else git clone https://github.com/Wikolabs/helpiqai.git /opt/helpiqai && cd /opt/helpiqai; fi && docker build -t helpiqai:local . && (docker stop helpiqai 2>/dev/null; docker rm helpiqai 2>/dev/null; true) && docker run -d --name helpiqai -p 3008:3000 --restart unless-stopped helpiqai:local && echo 'Deployed helpiqai on port 3008'"
